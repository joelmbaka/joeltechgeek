function save(){storage.setItem(KEY,JSON.stringify(data))}function C(id){return data.customers.find(x=>x.id===id)}function A(id){return data.assets.find(x=>x.id===id)}function J(id){return data.jobs.find(x=>x.id===id)}function human(s){if(!s)return'—';const [y,m,d]=s.split('-');return `${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m)-1]} ${y}`};function safe(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};function badge(s){const v=String(s);let type=/Approved|Serviceable|Completed/.test(v)?'green':/Overdue|Failed|Out of service|Follow-up/.test(v)?'red':/Due soon|Submitted|Attention/.test(v)?'amber':/Scheduled|In progress/.test(v)?'blue':'';return `<span class="badge ${type}">${safe(v)}</span>`};function go(route){ui.route=route;ui.query='';ui.filter='All';ui.modal='';syncPage('push');render()};function gotoCustomer(id){ui.customer=id;go('customer')};function gotoAsset(id){ui.asset=id;go('asset')};function gotoJob(id){ui.job=id;go(ui.role==='technician'?'tech-job':'job')};function toast(s){let o=document.querySelector('.toast');if(o)o.remove();o=document.createElement('div');o.className='toast';o.textContent=s;document.body.appendChild(o);setTimeout(()=>o.remove(),3300)}

function techJob(){const j=J(ui.job)||data.jobs[0],a=A(j.assetId),c=C(j.customerId),step=ui.step;let body='';if(j.status==='Submitted'||j.status==='Approved'||j.status==='Needs follow-up'){body=`<div class="banner green">${ic('check',16)} Submitted inspection record.</div><div class="job-tile"><div class="tech-label">SUMMARY</div><h3>${safe(c.name)}</h3><p>${a.name} · ${a.id}</p><p>Checklist: ${j.results?.filter(v=>v==='pass').length||0} passed · ${j.results?.filter(v=>v==='fail').length||0} failed.</p></div><button class="btn" data-nav="tech-home">${ic('left',14)} My service jobs</button>`}else if(step===0){body=`<div class="job-tile"><span class="tech-label">Customer</span><h3>${safe(c.name)}</h3><p>${safe(c.city)} · ${safe(a.location)}</p><div class="info-label">Equipment</div><strong>${safe(a.name)}</strong><p>${a.kind}</p><div class="info-label">Asset ID / Serial</div><strong>${a.id} / ${safe(a.serial)}</strong></div><div class="banner blue">${ic('map',15)} Confirm asset identity before inspecting.</div><div class="tech-footer"><button class="btn btn-primary" data-action="tech-next">Start inspection ${ic('arrow',14)}</button></div>`}else if(step===1){body=`<div class="small mute" style="margin-bottom:14px">Record the result for each required check.</div>${checks.map(([name,desc],i)=>`<div class="check-row"><div><strong>${name}</strong><small>${desc}</small></div><div class="choices">${[['pass','Pass'],['fail','Fail'],['na','N/A']].map(([v,label])=>`<button class="choice ${ui.checks[i]===v?'selected '+v:''}" data-check="${i}" data-value="${v}">${label}</button>`).join('')}</div></div>`).join('')}<div class="tech-footer"><button class="btn" data-action="tech-back">Back</button><button class="btn btn-primary" data-action="tech-next">Continue ${ic('arrow',14)}</button></div>`}else if(step===2){body=`<div class="form-row"><label>Inspection notes / findings</label><textarea class="textarea" id="techNote" placeholder="Record any fault, follow-up work, or service details...">${safe(ui.note)}</textarea></div><button class="tech-upload" data-action="photo">${ic('plus',17)} ${ui.photo?'1 simulated photo attached':'Add inspection photo (demo)'}</button>${ui.checks.includes('fail')?`<div class="banner section">${ic('alert',15)} Any failed or N/A check needs an explanation; failed checks prevent certificate approval.</div>`:''}<div class="tech-footer"><button class="btn" data-action="tech-back">Back</button><button class="btn btn-primary" data-action="tech-next">Review ${ic('arrow',14)}</button></div>`}else{body=`<div class="job-tile"><div class="rowbetween"><strong>Checklist summary</strong>${badge(ui.checks.some(v=>v!=='pass')?'Needs follow-up':'Pass')}</div><p style="margin:13px 0 7px">${ui.checks.filter(x=>x==='pass').length} passed · ${ui.checks.filter(x=>x==='fail').length} failed · ${ui.checks.filter(x=>x==='na').length} N/A</p><div class="muted-panel"><strong class="small">Technician notes</strong><p>${safe(ui.note||'No reported issues.')}</p></div></div><div class="banner">${ic('alert',15)} Submitting is not certification. An office reviewer must approve a passing record.</div><div class="tech-footer"><button class="btn" data-action="tech-back">Back</button><button class="btn btn-primary" data-action="submit-inspection">Submit report ${ic('check',14)}</button></div>`}

ustomer">${data.customers.map(c=>`<option value="${c.id}">${safe(c.name)}</option>`).join('')}</select></div><div class="form-row full"><label>Equipment name</label><input class="field" id="regName" placeholder="e.g. CO₂ Fire Extinguisher"/></div><div class="form-row"><label>Location</label><input class="field" id="regLoc" value="Main entrance"/></div><div class="form-row"><label>Next planned service</label><input class="field" type="date" id="regDue" value="2026-11-30"/></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-asset">Register</button></div>`}else if(ui.modal==='reminder'){const a=A(ui.reminderAsset)||data.assets[0],c=C(a.customerId);body=`<h2>Notification preview</h2><p class="mute small">Sample email — nothing will be sent.</p><div class="toggle-demo section"><div class="info-label">Customer / contact</div><strong>${safe(c.name)} / ${safe(c.contact)}</strong><div class="info-label" style="margin-top:12px">Subject</div><strong>Upcoming fire equipment service — ${safe(a.id)}</strong><p class="small" style="margin-top:14px">Hello ${safe(c.contact)},<br/><br/>The next planned service for ${safe(a.name)} (${safe(a.id)}) at ${safe(c.name)} is ${human(a.due)}. This reminder is configured for ${data.reminderDays} days before the planned service.<br/><br/>Fire Safety Ops Service Team</p></div><div class="banner section">${ic('shield',15)} Preview only — no message has been sent.</div><div class="modal-foot"><button class="btn btn-primary" data-action="close-modal">Close preview</button></div>`}else if(ui.modal==='confirm-reset'){body=`<h2>Restore sample data?</h2><p class="mute small">This removes browser-only changes and restores the initial fictional customers, jobs, and equipment.</p><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="confirm-reset">Reset demo</button></div>`}return `<div function render(){if(ui.role==='technician'&&!['tech-home','tech-job'].includes(ui.route))ui.route='tech-home';if(ui.role!=='technician'&&['tech-home','tech-job'].includes(ui.route))ui.route='overview';let page=ui.role==='technician'?(ui.route==='tech-job'?techJob():techHome()):({overview:dashboard,customers,customer,equipment,asset,jobs:jobsPage,job:jobDetail,certificates:certList,certificate,calendar:calendarPage,settings:settingsPage}[ui.route]||dashboard)();syncPage('replace');persistUi();document.querySelector('#root').innerHTML=shell(page)}
function approve(){const j=J(ui.job);if(!j||j.status!=='Submitted'){toast('Only submitted inspections can be reviewed.');return}if(j.results?.some(v=>v!=='pass')){j.status='Needs follow-up';const asset=A(j.assetId);asset.condition='Out of service';save();toast('Follow-up required. No certificate issued.')}else{j.status='Approved';const asset=A(j.assetId);asset.condition='Serviceable';asset.last=j.completedAt||j.date;const next=new Date(asset.last+'T12:00:00Z');next.setUTCMonth(next.getUTCMonth()+(asset.intervalMonths||6));asset.due=next.toISOString().slice(0,10);save();toast('Inspection approved. Sample certificate available.')}render()}
document.addEventListener('click',e=>{if(ui.modal&&e.target.classList?.contains('modal-backdrop')){ui.modal='';render();return}const el=e.target.closest('[data-nav],[data-action],[data-customer],[data-asset],[data-job],[data-cert],[data-role],[data-techjob],[data-check]');if(!el)return;const d=el.dataset;if(d.nav){go(d.nav);return}if(d.customer){gotoCustomer(d.customer);return}if(d.asset){gotoAsset(d.asset);return}if(d.job){gotoJob(d.job);return}if(d.cert){ui.job=d.cert;go('certificate');return}if(d.role){ui.role=d.role;go(d.role==='technician'?'tech-home':'overview');return}if(d.techjob){ui.job=d.techjob;ui.step=0;ui.checks=[null,null,null,null,null];ui.note='';ui.photo=false;go('tech-job');return}if(d.check!==undefined){ui.checks[Number(d.check)]=d.value;render();return}const a=d.action;if(!a)return;if(a==='reset'){ui.modal='confirm-reset';render()}else if(a==='confirm-reset'){data=structuredClone(seed);save();ui.modal='';ui.role='admin';go('overview');toast('Sample data restored.')}else if(a==='new-job'){ui.modal='new-job';render()}else if(a==='new-customer'){ui.modal='new-customer';render()}else if(a==='new-asset'){ui.modal='new-asset';render()}else if(a==='close-modal'){ui.modal='';render()}else if(a==='save-job'){const assetId=document.querySelector('#newAsset').value,date=document.querySelector('#newDate').value,tech=document.querySelector('#newTech').value,service=document.querySelector('#newService').value.trim();if(!date||!service){toast('Select a date and describe the service.');return}const id='JOB-'+String(250+data.jobs.length+1).padStart(4,'0');data.jobs.unshift({id,customerId:A(assetId).customerId,assetId,technician:tech,date,status:'Scheduled',service,results:null,note:'',photo:false,completedAt:null});save();ui.job=id;ui.modal='';go('job');toast('Demo job created.')}else if(a==='save-customer'){const name=document.querySelector('#newCustomerName').value.trim();if(!name){toast('Customer name is required.');return}const id='C'+(Math.max(...data.customers.map(c=>Number(c.id.slice(1))),0)+1);data.customers.push({id,name,sector:document.querySelector('#newCustomerSector').value,city:document.querySelector('#newCustomerCity').value,contact:'Not specified',phone:'—',sites:1});save();ui.customer=id;go('customer');toast('Demo customer added.')}else if(a==='save-asset'){const name=document.querySelector('#regName').value.trim();if(!name){toast('Equipment name is required.');return}const id='EQ-'+(1400+data.assets.length);data.assets.push({id,customerId:document.querySelector('#regCustomer').value,name,kind:'Fire safety equipment',location:document.querySelector('#regLoc').value,last:'',due:document.querySelector('#regDue').value,condition:'Serviceable',serial:'DEMO-'+id});save();ui.asset=id;go('asset');toast('Sample equipment added.')}else if(a==='open-tech'){ui.role='technician';ui.step=0;ui.checks=[null,null,null,null,null];ui.note='';ui.photo=false;go('tech-job')}else if(a==='open-certificate'){go('certificate')}else if(a==='open-manager'){ui.role='manager';syncPage('push');render();toast('Switched to manager review.')}else if(a==='approve'){approve()}else if(a==='print'){window.print()}else if(a==='preview-reminder'){ui.modal='reminder';render()}else if(a==='photo'){ui.photo=!ui.photo;render();toast(ui.photo?'Simulated evidence added.':'Simulated evidence removed.')}else if(a==='tech-next'){if(ui.step===1&&ui.checks.some(v=>!v)){toast('Complete all five checklist items before continuing.');return}if(ui.step<3){ui.step++;render()}}else if(a==='tech-back'){if(ui.step>0){ui.step--;render()}}else if(a==='submit-inspection'){const failed=ui.checks.includes('fail');if((failed||ui.checks.includes('na'))&&!ui.note.trim()){ui.step=2;render();toast('Please describe the failed check before submitting.');return}const j=J(ui.job);j.status='Submitted';j.results=[...ui.checks];j.note=ui.note;j.photo=ui.photo;j.completedAt='2026-10-29';save();render();toast('Inspection report submitted for review.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.query=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('search');if(input){input.focus();input.setSelectionRange(pos,pos)}}if(e.target.id==='techNote'){ui.note=e.target.value;persistUi()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal='';render();return}const row=e.target.closest('.cal-item[data-asset]');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gotoAsset(row.dataset.asset)}});
document.addEventListener('change',e=>{if(e.target.id==='reminderAsset'){ui.reminderAsset=e.target.value;render();return}if(e.target.id==='roleSwitch'){ui.role=e.target.value;go(ui.role==='technician'?'tech-home':'overview')}if(e.target.id==='filter'){ui.filter=e.target.value;render()}if(e.target.id==='days'){data.reminderDays=Number(e.target.value);save();render();toast('Reminder preview preference saved locally.')}});window.addEventListener('popstate',()=>{readPageUrl();ui.modal='';render()});render();
</script></body></html>
