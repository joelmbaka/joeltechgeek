name: CRM Workflow CI
on:
  push:
    branches: [mobile]
    paths:
      - 'app/api/agent-crm/**'
      - 'app/crm/**'
      - 'lib/agent-crm/**'
      - 'mobile-app/**'
      - 'tests/agent-crm-*.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crm-workflow-ci.yml'
  pull_request:
    branches: [main, mobile]
    paths:
      - 'app/api/agent-crm/**'
      - 'app/crm/**'
      - 'lib/agent-crm/**'
      - 'mobile-app/**'
      - 'tests/agent-crm-*.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crm-workflow-ci.yml'
permissions:
  contents: read
jobs:
  web-crm:
    name: Web CRM types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run test:crm-workflow
      - run: npm run test:crm-reminder-defaults
      - run: npm run test:crm-reminder-content
      - run: npm run test:crm-phase5
      - run: npx tsc --noEmit
  mobile-crm:
    name: Android JS TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
