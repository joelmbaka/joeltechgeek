name: Portfolio agent CRM checks

on:
  push:
    branches:
      - dev/joeltechgeek
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-public-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint changed CRM code
        run: npx eslint app/crm app/api/agent-crm lib/agent-crm components/SiteChrome.tsx app/layout.tsx
      - name: Build
        run: npm run build
